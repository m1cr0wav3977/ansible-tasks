---
- name: Ensure Docker keyrings dir exists (in case another role runs install later)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: apt update
  apt:
    update_cache: yes
    upgrade: yes
  ignore_errors: yes

- name: install apt packages
  apt:
    name: "{{ item }}"
    state: present
  with_items:
    - curl
    - git
    - aptitude
    - apt-transport-https
    - ca-certificates
    - software-properties-common
    - unattended-upgrades
  ignore_errors: yes

- name: Remove dependencies that are no longer required
  ansible.builtin.apt:
    autoremove: yes

- name: Disable cloud-init SSH password authentication
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-ansible-ssh-pwauth.cfg
    content: "ssh_pwauth: false\n"
    owner: root
    group: root
    mode: '0644'
  notify: Restart sshd

- name: Remove cloud-init SSH config drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart sshd

- name: Configure public-key-only SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*{{ item.key }}\s+'
    line: '{{ item.key }} {{ item.value }}'
    insertafter: EOF
  loop:
    - { key: PubkeyAuthentication, value: 'yes' }
    - { key: PasswordAuthentication, value: 'no' }
    - { key: KbdInteractiveAuthentication, value: 'no' }
    - { key: AuthenticationMethods, value: 'publickey' }
  notify: Restart sshd

- name: Validate effective SSH daemon configuration
  ansible.builtin.command: sshd -t
  changed_when: false
