---
- name: Ensure golang-go is installed
  apt:
    name: golang-go
    state: present
    update_cache: yes

- name: Ensure python3 is installed
  apt:
    name: python3
    state: present
    update_cache: yes

- name: Ensure python3-pip is installed
  apt:
    name: python3-pip
    state: present
    update_cache: yes

- name: Ensure Tools directory exists
  file:
    path: /home/ssm-user/Tools
    state: directory
    owner: ssm-user
    group: ssm-user
    mode: '0755'

- name: Ensure Tools/bin directory exists
  file:
    path: /home/ssm-user/Tools/bin
    state: directory
    owner: ssm-user
    group: ssm-user
    mode: '0755'

- name: Add Tools/bin to ssm-user PATH in .bashrc
  lineinfile:
    path: /home/ssm-user/.bashrc
    line: 'export PATH="$PATH:/home/ssm-user/Tools/bin"'
    state: present
    insertafter: EOF
    owner: ssm-user
    group: ssm-user
    mode: '0644'

- import_tasks: metasploit.yml
- import_tasks: bbot.yml
- import_tasks: nuclei.yml
- import_tasks: pacu.yml
- import_tasks: scoutsuite.yml