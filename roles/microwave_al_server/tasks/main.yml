---
- name: dnf update and upgrade system
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  ignore_errors: yes

- name: install base packages
  ansible.builtin.dnf:
    name:
      - curl
      - git
      - ca-certificates
      - dnf-plugins-core
      - dnf-automatic
    state: present
  ignore_errors: yes

- name: Remove dependencies that are no longer required
  ansible.builtin.dnf:
    autoremove: yes
